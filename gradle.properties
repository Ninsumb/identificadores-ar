org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Encoding fijo para la JVM que corre Gradle (compilación y tests).
# Es prevención de una diferencia entre plataformas, NO una config de
# performance: el proyecto se desarrolla en Windows -donde file.encoding puede
# ser cp1252 bajo JDK 17- y el CI corre en Linux -UTF-8-. Sin fijarlo, el
# default no es determinista y los literales no ASCII de los tests (acentos,
# eñes, dígitos arábigo-índicos y devanagari) podrían leerse distinto según la
# máquina. Ver .github/workflows/ci.yml y .gitattributes.
org.gradle.jvmargs=-Dfile.encoding=UTF-8

kotlin.code.style=official
